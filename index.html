<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pengumpulan Tugas</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;

background:linear-gradient(
135deg,
#A7EBF2,
#54ACBF,
#26658C,
#023859,
#011C40
);
}

.container{
width:1100px;
max-width:95%;
background:white;
border-radius:25px;
overflow:hidden;
display:flex;
box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.left-side{
flex:1;
display:flex;
justify-content:center;
align-items:center;
padding:50px;
background:#f8fcfd;
}

.illustration{
text-align:center;
}

.gambar{
width: 500px;
height: auto;
}

.illustration h2{
color:#023859;
margin-bottom:10px;
}

.illustration p{
color:#666;
line-height:1.6;
}

.right-side{
flex:1;
padding:50px;
}

.right-side h1{
color:#011C40;
margin-bottom:30px;
}

.input-group{
margin-bottom:18px;
}

label{
display:block;
margin-bottom:8px;
font-weight:600;
color:#023859;
}

input{
width:100%;
padding:15px;
border:none;
border-bottom:2px solid #ddd;
outline:none;
font-size:15px;
transition:.3s;
}

input:focus{
border-color:#54ACBF;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:50px;
cursor:pointer;
font-size:16px;
font-weight:bold;
color:white;

background:linear-gradient(
90deg,
#54ACBF,
#26658C
);

transition:.3s;
}

button:hover{
transform:translateY(-3px);
}

#status{
margin-top:15px;
text-align:center;
font-weight:bold;
}

.footer{
margin-top:20px;
text-align:center;
font-size:12px;
color:#888;
}

@media(max-width:768px){

.container{
flex-direction:column;
}

.left-side{
display:none;
}

.right-side{
padding:30px;
}

}

</style>
</head>
<body>

<body>

<div class="container">

<div class="left-side">

<div class="illustration">

<div>
    <img src="Tugasimage.jpeg" class="gambar">
</div>

<h2>Kumpulkan Tugas</h2>

<p>
Upload tugas anda disini,
dan pastikan isi dengan benar form disamping.
</p>

</div>

</div>

<div class="right-side">

<h1>Submit Tugas</h1>

<form id="formTugas">

<div class="input-group">
<label>Nama Mahasiswa</label>
<input type="text" id="nama" placeholder="Masukkan Nama" required>
</div>

<div class="input-group">
<label>NIM</label>
<input type="text" id="nim" placeholder="Masukkan NIM" required>
</div>

<div class="input-group">
<label>Link File Tugas</label>
<input
type="url"
id="link"
placeholder="https://drive.google.com/..."
required>
</div>

<button type="submit">
Kirim Tugas
</button>

</form>

<div id="status"></div>

<div class="footer">
Kumpulkan tugasmu dengan mudah.
</div>

</div>

</div>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwwaHJY-hIKHqnlIKI9Cxdx9Pu6-G8p4iUL1ZIo9P7-fFL1NBCWL2bKe1qmgTJMq87OKA/exec";

document.getElementById("formTugas")
.addEventListener("submit", async function(e){

e.preventDefault();

const btn = document.querySelector("button");
btn.disabled = true;
btn.innerText = "Mengirim...";

const data = {
nama: document.getElementById("nama").value,
nim: document.getElementById("nim").value,
link: document.getElementById("link").value
};

try{

await fetch(SCRIPT_URL,{
method:"POST",
body:JSON.stringify(data)
});

document.getElementById("status").innerHTML =
"✅ Tugas berhasil dikirim";

document.getElementById("formTugas").reset();

}catch(err){

document.getElementById("status").innerHTML =
"❌ Gagal mengirim data";

}

btn.disabled = false;
btn.innerText = "Kirim Tugas";

});

</script>

</body>
</html>
